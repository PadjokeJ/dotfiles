$font = Monospace
$bg = rgba(000000aa)
$accent = rgba(00FFFFFF)

$x = 0
$nameY = 80

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 1.75, linear
    animation = fadeOut, 1, 1.75, linear
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 2, linear
}

background {
    monitor =
    reload_cmd = wpaperctl get eDP-1
    noise = 0.06
    blur_passes = 2
}

input-field {
    monitor = eDP-1
    size = 400, 80
    outline_thickness = 4
    inner_color = $bg

    outer_color = $accent
    check_color = $accent
    fail_color = $accent

    font_color = $accent
    fade_on_empty = false
    rounding = 20
    rounding_power = 1

    font_family = $font
    placeholder_text =
    fail_text = ACCESS DENIED
    
    hide_input = false
    dots_text_format = *
    dots_size = 0.2

    position = $x, -80
}

label {
  monitor = eDP-1
  text = $USER
  font_family = $font
  font_size = 32

  color= $accent
  position = $x, $nameY
}

shape {
  monitor = eDP-1
  position = $x, $nameY
  size = 400, 80

  border_size = 4
  border_color = $accent
  color = $bg

  rounding = 20
  rounding_power = 1
}

